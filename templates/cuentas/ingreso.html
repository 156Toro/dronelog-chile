{% extends "base.html" %}
{% block contenido %}
<div class="row justify-content-center" style="margin-top:12vh"><div class="col-md-5 col-lg-4">
<div class="card"><div class="card-body p-4">
  <h1 class="h4 text-center mb-1"><i class="bi bi-airplane"></i> DroneLog Chile</h1>
  <p class="text-center text-muted mb-4">Registro automático de operaciones con drones</p>
  <form method="post">{% csrf_token %}
    {% if form.errors %}<div class="alert alert-danger">Correo o contraseña incorrectos.</div>{% endif %}
    <div class="mb-3"><label class="form-label">Correo</label><input type="email" name="username" class="form-control" required autofocus></div>
    <div class="mb-3"><label class="form-label">Contraseña</label><input type="password" name="password" class="form-control" required></div>
    <button class="btn btn-dl w-100">Ingresar</button>
  </form>
</div></div></div></div>
{% endblock %}
